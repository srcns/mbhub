[package]
name = "mbhub"
version = "1.0.0"
edition = "2024"
description = "Sovereign, serverless P2P collective memory network for atomic AI answers"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.28"
crossbeam-channel = "0.5"
libp2p = { version = "0.56", default-features = false, features = ["tcp", "noise", "yamux", "gossipsub", "tokio", "macros"] }
libp2p-swarm-derive = "0.35"
ratatui = "0.29"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tui-textarea = "0.7.0"
unicode-width = "=0.2.0"
ureq = { version = "2.10", features = ["json", "tls"] }
blake3 = "1.5"
regex = "1.10"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"


# v1.0 release binaries: small, fast, stripped.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
